services:
  # ----------------------------------------
  # 1. MQTT Broker (Mosquitto)
  # ----------------------------------------
  mosquitto_broker:
    image: eclipse-mosquitto:2
    container_name: mosquitto_broker
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    networks:
      - iot_net

  # ----------------------------------------
  # 2. Redis
  # ----------------------------------------
  redis_edge:
    image: redis:alpine
    container_name: redis_edge
    networks:
      - iot_net

  # ----------------------------------------
  # 3. Gateway (Simulando Raspberry Pi)
  # ----------------------------------------
  privacy_gateway:
    build: .
    container_name: gateway_simulado
    depends_on:
      - redis_edge
      - mosquitto_broker
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=redis_edge
      - MQTT_BROKER_HOST=mosquitto_broker 
      - MQTT_BROKER_PORT=1883
      - MGC_URL=http://host.docker.internal:8000
    networks:
      - iot_net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

networks:
  iot_net:
    driver: bridge